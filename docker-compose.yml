

services:
  # バックエンド（FastAPI）
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - PORT=8000
    depends_on:
      - db

  # フロントエンド（Vue.js / Vite）
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  # データベース（PostgreSQL）
  db:
    image: postgres:15-alpine
    container_name: team_progress_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  
  # ブラウザ版 VS Code（ローカル検証用）

  code-server:
    build:
        context: ./code-server
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:8080"

    environment:
      PASSWORD: ${CODE_SERVER_PASSWORD:?Set CODE_SERVER_PASSWORD in .env}

    volumes:
      - code_server_workspace:/home/coder/project

    command:
      - --bind-addr
      - 0.0.0.0:8080
      - --auth
      - password
      - /home/coder/project

    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0



volumes:
  postgres_data:
  code_server_workspace:
  code_server_config:
  code_server_data: